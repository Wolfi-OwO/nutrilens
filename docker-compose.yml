# The full stack for local development: Postgres, apps/api, apps/ai-server.
# apps/api and apps/ai-server each also have their own docker-compose.yml
# for developing one service in isolation — this is the one that wires all
# three together and matches how they actually talk to each other in
# deployment (ADR-0001: ai-server reachable only from api, never published
# to the host).
#
# Usage: cp .env.example .env && docker compose up

services:
  postgres:
    # postgis/postgis (not plain postgres) since #184: store_locations'
    # geography(Point) column needs the PostGIS extension. Same postgres:16
    # base image underneath, so nothing that doesn't touch store_locations
    # is affected.
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: nutrilens
      POSTGRES_PASSWORD: nutrilens
      POSTGRES_DB: nutrilens
    ports:
      - "5432:5432"
    volumes:
      - nutrilens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrilens"]
      interval: 2s
      timeout: 5s
      retries: 30  # Double retries to handle database load during tests
    command:
      - "postgres"
      - "-c"
      - "checkpoint_timeout=60"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=256MB"
      - "-c"
      - "maintenance_work_mem=32MB"

  ai-server:
    build:
      context: apps/ai-server
      dockerfile: Dockerfile
    expose:
      - "8000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://nutrilens:nutrilens@postgres:5432/nutrilens
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-do-not-use-in-production}
      PORT: "8080"
      NODE_ENV: development
      AI_SERVER_URL: http://ai-server:8000
      # Only ever raised for the e2e workflow (many accounts, one source IP);
      # the default matches production's real per-browsing-session budget.
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      # OAuth login (issue #153) — unset by default, so a login/register
      # page with no provider buttons is expected out of the box. Set the
      # nutrilens-staging Google/Microsoft app credentials in your own
      # .env to test the real flow locally; those apps are registered
      # against http://localhost:8080's own callback URLs specifically,
      # separate from production's (production is a verified/published
      # Google app with no test-user cap — never point this at it).
      OAUTH_FRONTEND_BASE_URL: ${OAUTH_FRONTEND_BASE_URL:-http://localhost:8080}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      ai-server:
        condition: service_started

volumes:
  nutrilens-pgdata:
