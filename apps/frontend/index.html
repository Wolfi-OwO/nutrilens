<!doctype html>
<!-- lang is the source-language fallback only. src/main.tsx overwrites it with
     the resolved locale (stored choice, else navigator.language, de-AT -> de)
     before React renders, and src/i18n/locale-context.tsx keeps it in step with
     the switcher afterwards. A static file cannot carry two values, and a
     screen reader voicing German copy with English phonemes is worse than an
     untranslated UI. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photograph your meal, check the AI estimate and track calories and macros against a diet plan. Own food database on USDA data, meal photos stripped of location data." />
    <title>NutriLens: Log meals from a photo, track calories and macros</title>
    <meta property="og:title" content="NutriLens: Log meals from a photo, track calories and macros" />
    <meta property="og:description" content="Photograph your meal, check the AI estimate and track calories and macros against a diet plan." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nutrilens.woofi-developments.at/" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebApplication","name":"NutriLens","url":"https://nutrilens.woofi-developments.at/","description":"Log meals from a photo and track calories and macros against a diet plan.","applicationCategory":"HealthApplication","operatingSystem":"Any (runs in the browser)","inLanguage":["en","de"]}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
