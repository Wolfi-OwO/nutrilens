name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  ai-server:
    name: apps/ai-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  api:
    name: apps/api
    runs-on: ubuntu-latest
    # The test suite (#29) hits a real database — same postgres:16-alpine
    # image apps/api/docker-compose.yml uses for local development.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrilens
          POSTGRES_PASSWORD: nutrilens
          POSTGRES_DB: nutrilens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrilens"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://nutrilens:nutrilens@localhost:5432/nutrilens_test
      JWT_SECRET: ci-only-jwt-secret-do-not-use-elsewhere
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: installed from the repo root so apps/api's
      # dependencies resolve the same way they do locally.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --workspace=@nutrilens/api

      - name: Lint
        run: npx eslint apps/api

      - name: Typecheck
        run: npm run typecheck --workspace=@nutrilens/api

      - name: Migrate test database
        run: npm run database:migrate --workspace=@nutrilens/api

      - name: Test
        run: npm test --workspace=@nutrilens/api

  ui-prototype:
    name: ui-prototype
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-prototype
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-prototype/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
