name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  ai-server:
    name: apps/ai-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-server
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test | tee test-output.log

      # Coverage is already measured and gated by pytest-cov's own
      # --cov-fail-under (pyproject.toml) — this just surfaces the number
      # on the PR's checks tab (issue #66), no separate service needed.
      - name: Coverage summary
        id: coverage
        if: always()
        run: |
          {
            echo "### apps/ai-server coverage"
            echo '```'
            grep -E "^(Name\s|-{5,}$|TOTAL\s)" test-output.log || echo "No coverage summary found in test output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          PCT=$(awk '/^TOTAL /{print $NF}' test-output.log | tr -d '%')
          echo "percentage=${PCT:-}" >> "$GITHUB_OUTPUT"

  api:
    name: apps/api
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}
    # The test suite (#29) hits a real database — same postgres:16-alpine
    # image apps/api/docker-compose.yml uses for local development.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrilens
          POSTGRES_PASSWORD: nutrilens
          POSTGRES_DB: nutrilens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrilens"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://nutrilens:nutrilens@localhost:5432/nutrilens_test
      JWT_SECRET: ci-only-jwt-secret-do-not-use-elsewhere
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: installed from the repo root so apps/api's
      # dependencies resolve the same way they do locally.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --workspace=@nutrilens/api

      - name: Lint
        run: npx eslint apps/api

      - name: Typecheck
        run: npm run typecheck --workspace=@nutrilens/api

      - name: Migrate test database
        run: npm run database:migrate --workspace=@nutrilens/api

      - name: Test
        run: npm test --workspace=@nutrilens/api | tee test-output.log

      # Coverage is already measured and gated by Node's own
      # --experimental-test-coverage flags (package.json's `test` script) —
      # this just surfaces the number on the PR's checks tab (issue #65).
      - name: Coverage summary
        id: coverage
        if: always()
        run: |
          {
            echo "### apps/api coverage"
            echo '```'
            grep "all files" test-output.log || echo "No coverage summary found in test output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          PCT=$(grep "all files" test-output.log | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2}')
          echo "percentage=${PCT:-}" >> "$GITHUB_OUTPUT"

  frontend:
    name: apps/frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: installed from the repo root so apps/frontend's
      # dependencies resolve the same way they do locally.
      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build --workspace=@nutrilens/frontend

      - name: Lint
        run: npm run lint --workspace=@nutrilens/frontend

  ui-prototype:
    name: ui-prototype
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-prototype
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-prototype/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  deploy-staging:
    name: Deploy to staging
    # GitLab-flow-style: main auto-deploys to staging on every merge, using
    # its own Azure identity/Container App (gh-nutrilens-staging /
    # nutrilens-staging — distinct from production's gh-nutrilens /
    # nutrilens, see the `staging` GitHub environment). Production only
    # deploys on a published release tag — see release.yml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repo-hygiene, ai-server, api, frontend, ui-prototype]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write # required for Azure OIDC login
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_PUSH_USERNAME }}
          password: ${{ secrets.ACR_PUSH_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve build date
        id: meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:staging-${{ github.sha }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:staging-latest
          build-args: |
            APP_VERSION=staging-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:staging-${{ github.sha }}" \
            --revision-suffix "sha-$(echo ${{ github.sha }} | cut -c1-12)"
