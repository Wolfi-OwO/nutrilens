name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  ai-server:
    name: apps/ai-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-server
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test | tee test-output.log

      # Coverage is already measured and gated by pytest-cov's own
      # --cov-fail-under (pyproject.toml) — this just surfaces the number
      # on the PR's checks tab (issue #66), no separate service needed.
      - name: Coverage summary
        id: coverage
        if: always()
        run: |
          {
            echo "### apps/ai-server coverage"
            echo '```'
            grep -E "^(Name\s|-{5,}$|TOTAL\s)" test-output.log || echo "No coverage summary found in test output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          PCT=$(awk '/^TOTAL /{print $NF}' test-output.log | tr -d '%')
          echo "percentage=${PCT:-}" >> "$GITHUB_OUTPUT"

  api:
    name: apps/api
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}
    # The test suite (#29) hits a real database — same postgis/postgis:16-3.4-alpine
    # image apps/api/docker-compose.yml uses for local development. Switched
    # from plain postgres:16-alpine in #184: store_locations needs the
    # PostGIS extension for its geography(Point) column. The image is a
    # strict superset of postgres:16-alpine (same base, postgis just isn't
    # CREATEd as an extension until a migration asks for it), so this has no
    # effect on anything that doesn't touch store_locations.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: nutrilens
          POSTGRES_PASSWORD: nutrilens
          POSTGRES_DB: nutrilens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrilens"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://nutrilens:nutrilens@localhost:5432/nutrilens_test
      JWT_SECRET: ci-only-jwt-secret-do-not-use-elsewhere
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: installed from the repo root so apps/api's
      # dependencies resolve the same way they do locally.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --workspace=@nutrilens/api

      - name: Lint
        run: npx eslint apps/api

      - name: Typecheck
        run: npm run typecheck --workspace=@nutrilens/api

      - name: Migrate test database
        run: npm run database:migrate --workspace=@nutrilens/api

      - name: Test
        run: npm test --workspace=@nutrilens/api | tee test-output.log

      # Coverage is already measured and gated by Node's own
      # --experimental-test-coverage flags (package.json's `test` script) —
      # this just surfaces the number on the PR's checks tab (issue #65).
      - name: Coverage summary
        id: coverage
        if: always()
        run: |
          {
            echo "### apps/api coverage"
            echo '```'
            grep "all files" test-output.log || echo "No coverage summary found in test output."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          PCT=$(grep "all files" test-output.log | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2}')
          echo "percentage=${PCT:-}" >> "$GITHUB_OUTPUT"

  frontend:
    name: apps/frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: installed from the repo root so apps/frontend's
      # dependencies resolve the same way they do locally.
      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build --workspace=@nutrilens/frontend

      - name: Lint
        run: npm run lint --workspace=@nutrilens/frontend

  ui-prototype:
    name: ui-prototype
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-prototype
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-prototype/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  e2e:
    name: e2e + accessibility
    runs-on: ubuntu-latest
    # Runs against the REAL stack — docker compose up, same images and
    # topology as production (apps/api serves apps/frontend's build) — not a
    # mocked frontend or a separate dev server. Covers #58 (registration,
    # login, meal logging, plan editing against a running stack) and #59
    # (WCAG AA scans via @axe-core/playwright on every core page).
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        env:
          # Raised from production's defaults (300 req/15min, 10 logins/15min
          # — both meant for one browsing session) because this suite creates
          # ~10 accounts from one source IP, each of which logs in once as
          # part of registering — see config/index.ts's apiRateLimitMax /
          # loginRateLimitMax doc comments for how this was actually found.
          API_RATE_LIMIT_MAX: "5000"
          LOGIN_RATE_LIMIT_MAX: "500"
          DATABASE_POOL_MAX: "30"
        run: docker compose up -d --build
      
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 60); do
            pg_isready -h localhost -U nutrilens -p 5432 && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become ready"
          exit 1

      - name: Wait for the stack to be healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || echo 000)
            [ "$code" = "200" ] && { echo "Healthy after ${i}0s"; exit 0; }
            sleep 10
          done
          echo "::error::apps/api never became healthy"
          docker compose logs
          exit 1
      
      - name: Verify PostGIS extension
        run: |
          for i in $(seq 1 10); do
            psql -h localhost -U nutrilens -d nutrilens -c "CREATE EXTENSION IF NOT EXISTS postgis;" 2>/dev/null && exit 0
            sleep 2
          done
          echo "Warning: PostGIS extension may not be available"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e + accessibility tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stack logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy-test:
    name: Deploy test revision (0% traffic)
    # Single Container App per service (nutrilens, nutrilens-ai-server), both
    # in multiple-revision mode — mirrors network-visualizer's pattern (see
    # organizational/deploy/azure-container-apps.md). Every push to main
    # builds both images and lands them as a NEW, INACTIVE-TRAFFIC revision
    # of the existing apps: reachable at its own FQDN for manual testing,
    # but never touching the traffic weight that serves production. This
    # job never calls `az containerapp ingress traffic set` — that is the
    # whole safety property. Production only gets traffic on a published
    # release — see release.yml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repo-hygiene, ai-server, api, frontend, ui-prototype, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Azure OIDC login
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_PUSH_USERNAME }}
          password: ${{ secrets.ACR_PUSH_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve build date and revision suffix
        id: meta
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Named after the in-progress version (package.json) + run number,
          # not the raw commit sha — so `az containerapp revision list` reads
          # as "v0-1-0-dev-42" instead of an opaque hex string, matching how
          # network-visualizer names its revisions after something readable.
          PKG_VERSION=$(node -p "require('./package.json').version" | tr '.' '-')
          echo "suffix=v${PKG_VERSION}-dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and push apps/api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:test-${{ github.sha }}
          build-args: |
            APP_VERSION=test-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push apps/ai-server image
        uses: docker/build-push-action@v7
        with:
          context: apps/ai-server
          file: apps/ai-server/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.AI_SERVER_IMAGE_NAME }}:test-${{ github.sha }}
          cache-from: type=gha,scope=ai-server
          cache-to: type=gha,mode=max,scope=ai-server

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upgrade the containerapp CLI extension
        run: az extension add --name containerapp --upgrade -y -o none

      - name: Generate a shared internal-service token for this test run
        id: internal_token
        run: echo "token=$(openssl rand -hex 32)" >> "$GITHUB_OUTPUT"

      - name: Create the ai-server test revision (zero traffic)
        id: ai_rev
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          APP: ${{ vars.AI_SERVER_CONTAINERAPP_NAME }}
          ACR: ${{ vars.ACR_NAME }}
          IMAGE: ${{ vars.AI_SERVER_IMAGE_NAME }}
          TAG: test-${{ github.sha }}
        run: |
          set -euo pipefail
          az containerapp revision set-mode -g "$RG" -n "$APP" --mode multiple -o none
          az containerapp update -g "$RG" -n "$APP" --max-inactive-revisions 5 -o none

          FROM=$(az containerapp show -g "$RG" -n "$APP" \
            --query "properties.configuration.ingress.traffic[?weight==\`100\`].revisionName | [0]" -o tsv)
          if [ -z "$FROM" ] || [ "$FROM" = "null" ]; then
            # Traffic can be pinned to an explicit revisionName (the normal
            # case) or tracking `latestRevision: true` (Azure's default until
            # something pins it explicitly) — that entry has no revisionName
            # field at all, which is what made this branch necessary.
            LATEST_AT_100=$(az containerapp show -g "$RG" -n "$APP" \
              --query "properties.configuration.ingress.traffic[?weight==\`100\` && latestRevision==\`true\`] | length(@)" -o tsv)
            if [ "$LATEST_AT_100" = "1" ]; then
              FROM=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)
            fi
          fi
          if [ -z "$FROM" ] || [ "$FROM" = "null" ]; then
            echo "::error::No ai-server revision is serving 100% of traffic — refusing to guess the production baseline."
            exit 1
          fi

          SUFFIX="${{ steps.meta.outputs.suffix }}"
          REV="${APP}--${SUFFIX}"
          az containerapp revision copy -g "$RG" -n "$APP" \
            --from-revision "$FROM" \
            --image "${ACR}.azurecr.io/${IMAGE}:${TAG}" \
            --revision-suffix "$SUFFIX" \
            --set-env-vars "AI_SERVER_INTERNAL_SERVICE_TOKEN=${{ steps.internal_token.outputs.token }}" \
            --min-replicas 0 --max-replicas 5 -o none

          # min-replicas 0, same as production — a test revision that sits
          # idle between test runs must not hold a paid-for replica 24/7.
          # (This previously ran min-replicas 1 "to keep it warm for the api
          # test revision below to call" — real, but the wrong trade: an idle
          # test build costing the same as a warm one is worse than the api
          # test revision eating one cold start.) ai-server is --ingress
          # internal (ADR-0001/NFR-SEC-01), so this runner cannot curl it to
          # force a wake — ScaledToZero is accepted as healthy here, same as
          # release.yml's production rollout.
          # max-replicas 5 matches production rather than the 1 this used to
          # run: a max of 1 makes Azure report the revision as
          # "Running (at max)" the moment its single replica is up, which is
          # indistinguishable in the portal from a revision actually pinned
          # against its ceiling. min-replicas 0 still means it costs nothing idle.
          for i in $(seq 1 60); do
            STATE=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$REV" \
              --query properties.runningState -o tsv 2>/dev/null || echo Unknown)
            echo "[$i/30] ai-server test revision runningState=$STATE"
            case "$STATE" in
              Running|ScaledToZero) break ;;
              Failed|Degraded)
                echo "::error::ai-server test revision failed to start."
                az containerapp logs show -g "$RG" -n "$APP" --revision "$REV" --tail 50 --type console || true
                exit 1 ;;
            esac
            sleep 10
          done

          FQDN=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$REV" --query properties.fqdn -o tsv)
          echo "fqdn=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Create the api test revision (zero traffic)
        id: api_rev
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          APP: ${{ vars.CONTAINERAPP_NAME }}
          ACR: ${{ vars.ACR_NAME }}
          IMAGE: ${{ vars.IMAGE_NAME }}
          TAG: test-${{ github.sha }}
          AI_SERVER_URL: ${{ steps.ai_rev.outputs.fqdn }}
        run: |
          set -euo pipefail
          az containerapp revision set-mode -g "$RG" -n "$APP" --mode multiple -o none
          az containerapp update -g "$RG" -n "$APP" --max-inactive-revisions 5 -o none

          FROM=$(az containerapp show -g "$RG" -n "$APP" \
            --query "properties.configuration.ingress.traffic[?weight==\`100\`].revisionName | [0]" -o tsv)
          if [ -z "$FROM" ] || [ "$FROM" = "null" ]; then
            LATEST_AT_100=$(az containerapp show -g "$RG" -n "$APP" \
              --query "properties.configuration.ingress.traffic[?weight==\`100\` && latestRevision==\`true\`] | length(@)" -o tsv)
            if [ "$LATEST_AT_100" = "1" ]; then
              FROM=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)
            fi
          fi
          if [ -z "$FROM" ] || [ "$FROM" = "null" ]; then
            echo "::error::No api revision is serving 100% of traffic — refusing to guess the production baseline."
            exit 1
          fi

          SUFFIX="${{ steps.meta.outputs.suffix }}"
          REV="${APP}--${SUFFIX}"
          # AI_SERVER_URL is pinned to the ai-server TEST revision above, not
          # the app's stable ingress — otherwise this test revision would
          # silently call production's ai-server.
          # max-replicas 5 matches production rather than the 1 this used to
          # run: a max of 1 makes Azure report the revision as
          # "Running (at max)" the moment its single replica is up, which is
          # indistinguishable in the portal from a revision actually pinned
          # against its ceiling. min-replicas 0 still means it costs nothing idle.
          az containerapp revision copy -g "$RG" -n "$APP" \
            --from-revision "$FROM" \
            --image "${ACR}.azurecr.io/${IMAGE}:${TAG}" \
            --revision-suffix "$SUFFIX" \
            --set-env-vars "AI_SERVER_URL=${AI_SERVER_URL}" "INTERNAL_SERVICE_TOKEN=${{ steps.internal_token.outputs.token }}" \
            --min-replicas 0 --max-replicas 5 -o none

          FQDN=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$REV" --query properties.fqdn -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 60); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 "https://$FQDN/health" 2>/dev/null || echo 000)
            echo "[$i/30] api test revision probe=$CODE"
            [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ] && break
            if [ "$i" = 30 ]; then
              echo "::error::api test revision never served a successful /health response."
              az containerapp logs show -g "$RG" -n "$APP" --revision "$REV" --tail 50 --type console || true
              exit 1
            fi
            sleep 10
          done

      - name: Retire superseded test revisions
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          CURRENT_SUFFIX: ${{ steps.meta.outputs.suffix }}
        run: |
          set -euo pipefail
          for APP in "${{ vars.CONTAINERAPP_NAME }}" "${{ vars.AI_SERVER_CONTAINERAPP_NAME }}"; do
            # "-dev-" (from the "v<version>-dev-<run>" suffix, see the meta
            # step) is what marks a revision as a test build rather than a
            # release — a substring match survives the package.json version
            # changing, unlike matching on the old "test-<sha>" prefix would.
            # Also catches now-orphaned "--test-<sha>"-named revisions from
            # before this naming scheme, so the transition self-cleans.
            for OLD in $(az containerapp revision list -g "$RG" -n "$APP" \
                --query "[?properties.active && properties.trafficWeight == \`0\` && (contains(name, '-dev-') || contains(name, '--test-'))].name" -o tsv); do
              [ "$OLD" = "${APP}--${CURRENT_SUFFIX}" ] && continue
              echo "Deactivating superseded test revision $OLD"
              az containerapp revision deactivate -g "$RG" -n "$APP" --revision "$OLD" -o none || true
            done
          done

      - name: Summary
        run: |
          {
            echo "### Test revision deployed (0% production traffic)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| apps/api | ${{ steps.api_rev.outputs.url }} |"
            echo "| apps/ai-server | internal-only, reachable through the api URL above |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
