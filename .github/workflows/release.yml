name: Release Deploy

# Publishing a GitHub Release builds apps/api's image, pushes it to the
# shared Azure Container Registry (globalcr01), and rolls the Azure
# Container App onto the new tag.
#
# Mirrors portfolio-webpage/network-visualizer's release workflow: the image
# push uses a scoped ACR token (no Azure AD identity needed), and only the
# final containerapp rollout needs Azure OIDC login — kept in its own job
# behind the `production` environment so a release only waits on one step.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build and deploy (defaults to the git ref name)"
        required: false

permissions:
  contents: read
  id-token: write # required for Azure OIDC login in deploy-to-production

jobs:
  resolve-metadata:
    name: Resolve image metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      build_date: ${{ steps.meta.outputs.build_date }}
      revision_suffix: ${{ steps.meta.outputs.revision_suffix }}
    steps:
      - name: Compute tag, image, build date & revision suffix
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve an image tag from the triggering event."
            exit 1
          fi
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}"

          # A revision suffix may only hold lowercase alphanumerics and dashes.
          SUFFIX=$(echo "$TAG" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]\+/-/g; s/^-\+//; s/-\+$//')
          if [ -z "$SUFFIX" ]; then
            echo "::error::Tag '${TAG}' normalises to an empty revision suffix."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "revision_suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${IMAGE}:${TAG} (revision suffix: ${SUFFIX})"

  push-image:
    name: Push image to ACR
    runs-on: ubuntu-latest
    needs: resolve-metadata
    steps:
      - uses: actions/checkout@v7

      # Scoped ACR token (push-only, revocable, shared across projects on
      # globalcr01) — no Azure AD identity or OIDC login needed for this job.
      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_PUSH_USERNAME }}
          password: ${{ secrets.ACR_PUSH_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # Plain single-platform manifest, not an OCI index — see
          # portfolio-webpage's release.yml for why (an ACR cleanup that
          # reaps untagged children took production down there once).
          provenance: false
          sbom: false
          tags: |
            ${{ needs.resolve-metadata.outputs.image }}:${{ needs.resolve-metadata.outputs.tag }}
            ${{ needs.resolve-metadata.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ needs.resolve-metadata.outputs.tag }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.resolve-metadata.outputs.build_date }}
            APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-production:
    name: Deploy to Azure Container App
    runs-on: ubuntu-latest
    needs: [resolve-metadata, push-image]
    environment: production
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ needs.resolve-metadata.outputs.image }}:${{ needs.resolve-metadata.outputs.tag }}" \
            --revision-suffix "${{ needs.resolve-metadata.outputs.revision_suffix }}"

      - name: Show deployed revision
        run: |
          az containerapp revision list \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "[0].{revision:name, active:properties.active, image:properties.template.containers[0].image}" \
            -o table
